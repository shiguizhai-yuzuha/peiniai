<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>所有功能 · 陪你AI</title>
<style>
:root{
  --ink:#f6f1ea; --dim:rgba(246,241,234,.62); --soft:rgba(246,241,234,.36);
  --warm:#ffb98a; --r-m:12px; --r-l:16px; --r-full:999px;
  --line:rgba(255,255,255,.10); --line-hi:rgba(255,255,255,.20);
  --glass:rgba(255,255,255,.05); --glass-hi:rgba(255,255,255,.10);
  --e:cubic-bezier(.2,.7,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  background:
    radial-gradient(120% 70% at 50% -8%, rgba(255,172,112,.12) 0%, transparent 60%),
    linear-gradient(180deg,#131a2a 0%,#0b0f18 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Songti SC","Noto Serif SC",-apple-system,"PingFang SC","Microsoft YaHei",serif;
  -webkit-font-smoothing:antialiased;
  padding:0 0 60px;
}

#top{
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px;
  background:rgba(11,15,24,.78);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
#top .t{font-size:13px; letter-spacing:.24em; color:var(--dim)}
#top .t b{color:var(--ink); font-weight:400}
#top a{
  padding:.55em 1.1em; border-radius:var(--r-full); text-decoration:none;
  font-size:11.5px; letter-spacing:.18em; color:var(--dim);
  border:1px solid var(--line); background:var(--glass);
  transition:.26s var(--e);
}
#top a:hover{background:var(--glass-hi); border-color:var(--line-hi); color:var(--ink)}
#top a:active{transform:scale(.96)}

.wrap{max-width:820px; margin:0 auto; padding:18px 16px}

.card{
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  border-radius:var(--r-l);
  padding:18px 18px 16px;
  margin-bottom:14px;
}
.card > h2{
  font-size:11.5px; font-weight:400; letter-spacing:.3em;
  color:var(--soft); margin-bottom:14px;
  display:flex; justify-content:space-between; align-items:center;
}
.card > h2 .cnt{letter-spacing:.1em; opacity:.7}

/* 概览 */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.stat{text-align:center}
.stat .n{font-size:clamp(18px,5vw,24px); color:#fff}
.stat .l{font-size:10px; letter-spacing:.2em; color:var(--soft); margin-top:6px}

/* 角色一览 */
.plist{display:flex; flex-direction:column; gap:8px}
.prow{
  display:grid; grid-template-columns:88px 1fr 60px 60px;
  align-items:center; gap:10px;
  padding:.7em .9em; border-radius:var(--r-m);
  border:1px solid var(--line); background:var(--glass);
  font-size:12.5px; color:var(--dim);
}
.prow b{color:var(--ink); font-weight:400; letter-spacing:.12em}
.prow .bar{height:3px; border-radius:var(--r-full); background:rgba(38,86,140,.16); overflow:hidden}
.prow .bar i{display:block; height:100%; border-radius:var(--r-full);
  background:linear-gradient(90deg,#3f9bff,#9fdcff)}
.prow .num{text-align:right; font-size:11px; color:var(--soft); font-variant-numeric:tabular-nums}

/* 记忆分组 */
.group{margin-bottom:16px}
.group:last-child{margin-bottom:0}
.gh{
  display:flex; align-items:center; gap:8px;
  font-size:11.5px; letter-spacing:.2em; color:var(--warm);
  margin-bottom:8px;
}
.gh span{font-size:10px; color:var(--soft); letter-spacing:.1em}
.mem{
  display:flex; align-items:flex-start; gap:10px;
  padding:8px 0; border-bottom:1px solid rgba(255,255,255,.05);
}
.mem:last-child{border-bottom:none}
.mem .k{flex:none; min-width:76px; font-size:10px; letter-spacing:.1em;
  color:var(--soft); padding-top:.3em}
.mem .v{flex:1; font-size:13.5px; line-height:1.7; word-break:break-word}
.mem .pin{
  flex:none; width:26px; height:26px; border-radius:var(--r-full); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line); background:transparent; color:var(--soft);
  font-size:12px; transition:.24s var(--e);
}
.mem .pin:hover{background:var(--glass-hi); border-color:var(--line-hi); color:var(--ink)}
.mem .pin.on{color:#ffcf9e; border-color:rgba(255,190,150,.45); background:rgba(255,190,150,.10)}

/* 背景 */
.bgs{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px}
.bg{
  position:relative; aspect-ratio:3/4; border-radius:var(--r-m);
  overflow:hidden; cursor:pointer; border:2px solid transparent;
  background:rgba(255,255,255,.06);
  transition:transform .14s var(--e), border-color .26s var(--e);
}
.bg img{width:100%; height:100%; object-fit:cover; display:block;
  filter:saturate(.9) brightness(.85)}
.bg:hover img{filter:none}
.bg:active{transform:scale(.96)}
.bg.on{border-color:rgba(255,190,150,.75); box-shadow:0 0 0 3px rgba(255,190,150,.14)}
.bg span{position:absolute; left:0; right:0; bottom:0; padding:.35em .3em;
  font-size:9px; letter-spacing:.08em; text-align:center; color:rgba(255,255,255,.85);
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.72))}

/* 选项 */
.opts{display:flex; flex-direction:column; gap:8px}
.opt{
  display:block; width:100%; text-align:left;
  padding:.85em 1em; border-radius:var(--r-m); cursor:pointer;
  border:1px solid var(--line); background:var(--glass);
  color:var(--dim); font-family:inherit; font-size:13.5px; letter-spacing:.06em;
  transition:.26s var(--e);
}
.opt:hover{background:var(--glass-hi); border-color:var(--line-hi); color:var(--ink)}
.opt.on{border-color:rgba(255,190,150,.55); background:rgba(255,190,150,.10); color:var(--ink)}
.opt small{display:block; font-size:10.5px; color:var(--soft); letter-spacing:.1em; margin-top:.35em}

.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.btn{
  padding:.72em 1.2em; border-radius:var(--r-m); cursor:pointer; text-decoration:none;
  border:1px solid var(--line); background:var(--glass); color:var(--dim);
  font-family:inherit; font-size:12.5px; letter-spacing:.16em;
  transition:.26s var(--e); display:inline-block;
}
.btn:hover{background:var(--glass-hi); border-color:var(--line-hi); color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.warn{border-color:rgba(255,140,120,.3); color:#ffb0a0}
.btn.warn:hover{background:rgba(255,140,120,.12); border-color:rgba(255,140,120,.55)}

.empty{font-size:12.5px; color:var(--soft); letter-spacing:.1em}

@media (max-width:480px){
  .wrap{padding:12px 12px}
  .card{padding:15px 14px 13px}
  .stats{grid-template-columns:repeat(2,1fr); gap:14px}
  .prow{grid-template-columns:70px 1fr 50px; font-size:11.5px}
  .prow .num:last-child{display:none}
  .mem .k{min-width:62px; font-size:9.5px}
}
</style>
</head>
<body>

<div id="top">
  <div class="t">所有功能 · <b id="who">—</b></div>
  <a href="/app">回聊天</a>
</div>

<div class="wrap">

  <div class="card">
    <h2>概览</h2>
    <div class="stats">
      <div class="stat"><div class="n" id="sDays">—</div><div class="l">天</div></div>
      <div class="stat"><div class="n" id="sMsg">—</div><div class="l">条对话</div></div>
      <div class="stat"><div class="n" id="sMem">—</div><div class="l">条记忆</div></div>
      <div class="stat"><div class="n" id="sPer">—</div><div class="l">个角色</div></div>
    </div>
  </div>

  <div class="card">
    <h2>角色 <span class="cnt" id="pCnt"></span></h2>
    <div class="plist" id="plist"></div>
  </div>

  <div class="card">
    <h2>所有记忆 <span class="cnt" id="mCnt"></span></h2>
    <div id="mems"><div class="empty">还没有。</div></div>
  </div>

  <div class="card">
    <h2 id="bgTitle">背景（一次给所有角色）</h2>
    <div class="bgs" id="bgs"></div>
    <div class="actions">
      <button class="btn" id="resetBg">用回原来的</button>
    </div>
  </div>

  <div class="card">
    <h2>她怎么记住你</h2>
    <div class="opts" id="modes">
  <button class="opt" data-mode="pure">纯 BM25<small>检索到什么，原样说给你听——她不会忘，也不会淡</small></button>
  <button class="opt" data-mode="mixed">BM25 + 遗忘曲线<small>检索照旧，讲的时候按时间分档：清楚 / 糊 / 只剩影子</small></button>
  <button class="opt" data-mode="auto">跟随站点默认<small>不单独设，用全局那一个</small></button>
    </div>
  </div>

  <div class="card">
    <h2>里程碑</h2>
    <div id="miles"><div class="empty">读取中……</div></div>
  </div>

  <div class="card">
    <h2 id="importTitle">导入聊天记录</h2>
    <p class="empty" style="margin-bottom:10px">
      把别处的聊天记录粘进来，她会自己提炼出记住的事。格式不用管：<code>名字: 内容</code> 一行一句，认不出来就整段当材料读。
    </p>
    <textarea id="impText" rows="5" placeholder="把聊天记录粘在这里……"
      style="width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);
             background:rgba(255,255,255,.04);color:var(--ink);font-family:inherit;
             font-size:13.5px;line-height:1.7;outline:none;resize:vertical"></textarea>
    <div class="actions">
      <input id="impWho" placeholder="（可选）你自己在记录里的名字"
        style="padding:.6em .9em;border-radius:12px;border:1px solid var(--line);
               background:rgba(255,255,255,.04);color:var(--ink);font-family:inherit;font-size:13px">
      <button class="btn" id="impBtn">导入</button>
    </div>
    <div class="empty" id="impMsg" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>自定义角色</h2>
    <div id="mine"><div class="empty">读取中……</div></div>
    <div class="actions">
      <button class="btn warn" id="delMine">删掉我的自定义角色</button>
    </div>
    <div class="empty" id="mineMsg" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>剧情</h2>
    <div id="story"><div class="empty">读取中……</div></div>
  </div>

  <div class="card">
    <h2>纪念册</h2>
    <div class="empty" style="margin-bottom:10px">
      把她记得的东西做成一本可以留下来的册子。
    </div>
    <div class="actions">
      <button class="btn" id="bookBtn">做一本</button>
    </div>
    <div class="empty" id="bookMsg" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h2>带走</h2>
    <div class="actions">
      <a class="btn" id="dlAll" href="#">下载全部对话和记忆</a>
      <a class="btn warn" href="/?ui=old">回旧界面</a>
    </div>
  </div>


    <div class="card" id="allpages">
      <h2>全部页面</h2>
      <p class="hint">这个站一共有这些页面。点开是新标签页，不会打断你正在聊的。</p>
      <div class="links">
        <a href="/voice" target="_blank">她说话的样子</a>
        <a href="/piano" target="_blank">她弹琴</a>
        <a href="/keys" target="_blank">电子琴</a>
        <a href="/scene/beach" target="_blank">海边</a>
        <a href="/scene/rose" target="_blank">粒子玫瑰</a>
        <a href="/ab" target="_blank">声音盲测</a>
        <a href="/notice" target="_blank">更新公告</a>
        <a href="/?ui=old" target="_blank">旧界面</a>
      </div>
    </div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const U = localStorage.getItem("pn_uid") || "";

async function api(path, body){
  const opt = { method: body ? "POST" : "GET", headers: {} };
  if (body){ opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  return await r.json();
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

async function load(){
  if (!U){
    $("mems").innerHTML = '<div class="empty">先回聊天页登录。</div>';
    return;
  }
  $("dlAll").href = "/api/export_all?u=" + encodeURIComponent(U);

  const d = await api("/api/global?u=" + encodeURIComponent(U));
  if (!d.ok){ $("mems").innerHTML = '<div class="empty">读取失败：' + esc(d.error) + '</div>'; return; }

  const st = d.stats || {};
  $("sDays").textContent = st.days || 0;
  $("sMsg").textContent = st.messages || 0;
  $("sMem").textContent = st.memories || 0;
  $("sPer").textContent = st.personas || 0;
  $("who").textContent = (d.user && d.user.nickname) || "";
  $("pCnt").textContent = (st.personas || 0) + " 个";
  $("mCnt").textContent = (st.memories || 0) + " 条";

  // 角色一览
  const ps = d.personas || [];
  $("plist").innerHTML = ps.map(x =>
    '<div class="prow">' +
      '<b>' + esc(x.persona) + '</b>' +
      '<span class="bar"><i style="width:' + Math.min(100, x.intimacy) + '%"></i></span>' +
      '<span class="num">' + x.intimacy + '</span>' +
      '<span class="num">' + x.memories + ' 条</span>' +
    '</div>').join("") || '<div class="empty">还没有角色。</div>';

  // 记忆（按角色分组）
  const groups = d.memories || {};
  const keys = Object.keys(groups);
  if (!keys.length){
    $("mems").innerHTML = '<div class="empty">还没有。聊几句，她会开始记。</div>';
  } else {
    $("mems").innerHTML = keys.map(p =>
      '<div class="group">' +
        '<div class="gh">' + esc(p) + ' <span>' + groups[p].length + ' 条</span></div>' +
        groups[p].map(m =>
          '<div class="mem">' +
            '<div class="k">' + esc(prettyKey(m.key)) + '</div>' +
            '<div class="v">' + esc(m.value) + '</div>' +
            '<button class="pin' + (m.pinned ? " on" : "") + '"' +
              ' data-p="' + esc(p) + '" data-key="' + esc(prettyKey(m.key)) + '"' +
              ' data-on="' + (m.pinned ? 1 : 0) + '">' + (m.pinned ? "★" : "☆") + '</button>' +
          '</div>').join("") +
      '</div>').join("");

    $("mems").querySelectorAll(".pin").forEach(b => {
      b.addEventListener("click", async () => {
        const on = b.dataset.on === "1";
        const r = await api("/api/pin_memory", {
          user_id: U, persona: b.dataset.p, key: b.dataset.key, pinned: !on
        });
        if (r.ok){
          b.dataset.on = on ? "0" : "1";
          b.classList.toggle("on", !on);
          b.textContent = on ? "☆" : "★";
        }
      });
    });
  }

  // 记忆模式
  const mode = (d.user || {}).memory_mode || "auto";
  $("modes").querySelectorAll(".opt").forEach(o => {
    const m = o.dataset.mode;
    o.classList.toggle("on", (m === "auto") ? (!mode || mode === "auto") : (mode === m));
    o.addEventListener("click", async () => {
      const r = await api("/api/memory_mode", { user_id: U, mode: m });
      if (r.ok){
        $("modes").querySelectorAll(".opt").forEach(x => x.classList.remove("on"));
        o.classList.add("on");
      }
    });
  });

  await loadBgs();
}

async function loadBgs(){
  const d = await api("/api/bglist");
  const list = (d && d.list) || [];
  $("bgs").innerHTML = list.map(x =>
    '<div class="bg" data-file="' + esc(x.file) + '" title="' + esc(x.label || x.name) + '">' +
      '<img src="/bg/' + encodeURIComponent(x.file) + '" loading="lazy" alt="' + esc(x.label || x.name) + '">' +
      '<span>' + esc(x.label || x.name) + '</span>' +
    '</div>').join("") || '<div class="empty">没有可选背景。</div>';

  $("bgs").querySelectorAll(".bg").forEach(b => {
    b.addEventListener("click", async () => {
      const r = await api("/api/setbg_all", { user_id: U, file: b.dataset.file });
      if (r.ok){
        $("bgs").querySelectorAll(".bg").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
      }
    });
  });
}

$("resetBg").addEventListener("click", async () => {
  const r = await api("/api/setbg_all", { user_id: U, file: "" });
  if (r.ok) $("bgs").querySelectorAll(".bg").forEach(x => x.classList.remove("on"));
});

/* ---- 里程碑 ---- */
async function loadMiles(){
  const p = localStorage.getItem("pn_persona") || "";
  if (!U || !p) { $("miles").innerHTML = '<div class="empty">先回聊天页登录。</div>'; return; }
  const d = await api("/api/milestones?u=" + encodeURIComponent(U) + "&p=" + encodeURIComponent(p));
  if (d.ok && d.html){
    $("miles").innerHTML = d.html;
  } else {
    $("miles").innerHTML = '<div class="empty">还没有里程碑。</div>';
  }
}

/* ---- 自定义角色 ---- */
async function loadMine(){
  if (!U) { $("mine").innerHTML = '<div class="empty">先登录。</div>'; return; }
  const d = await api("/api/my_personas?u=" + encodeURIComponent(U));
  const list = (d && d.list) || [];
  $("mine").innerHTML = list.length
    ? list.map(x => '<div class="mem"><div class="k">角色</div><div class="v">' + esc(x.persona) + '</div></div>').join("")
    : '<div class="empty">你还没有自定义角色。</div>';
}

$("delMine").addEventListener("click", async () => {
  if (!U) return;
  $("mineMsg").textContent = "……";
  const d = await api("/api/delete_persona", { user_id: U });
  $("mineMsg").textContent = d.ok ? "删掉了" : (d.msg || d.error || "没删成");
  if (d.ok) loadMine();
});

/* ---- 导入 ---- */
$("impBtn").addEventListener("click", async () => {
  const p = localStorage.getItem("pn_persona") || "";
  const text = $("impText").value.trim();
  if (!U || !p) { $("impMsg").textContent = "先回聊天页登录。"; return; }
  if (!text) { $("impMsg").textContent = "先粘点内容。"; return; }
  $("impMsg").textContent = "正在读……";
  const d = await api("/api/import", {
    user_id: U, persona: p, text: text, my_name: $("impWho").value.trim()
  });
  $("impMsg").textContent = d.ok ? ("提炼出 " + d.count + " 条") : ("失败：" + (d.error || ""));
  if (d.ok) { $("impText").value = ""; load(); }
});

/* ---- 剧情 ---- */
async function loadStory(){
  if (!U) { $("story").innerHTML = '<div class="empty">先登录。</div>'; return; }
  const d = await api("/api/story_list?u=" + encodeURIComponent(U));
  $("story").innerHTML = (d.ok && d.html) ? d.html : '<div class="empty">还没有剧情。</div>';
}

/* ---- 纪念册 ---- */
$("bookBtn").addEventListener("click", async () => {
  const p = localStorage.getItem("pn_persona") || "";
  if (!U || !p){ $("bookMsg").textContent = "先回聊天页登录。"; return; }
  $("bookMsg").textContent = "正在做……";
  try {
    const d = await api("/api/book?u=" + encodeURIComponent(U) + "&p=" + encodeURIComponent(p));
    if (!d.ok){
      $("bookMsg").textContent = "失败：" + (d.error || d.msg || "");
      return;
    }
    // 后端给的是 markdown，把 [文字](链接) 变成真链接
    let s2 = esc(d.msg || "好了");
    s2 = s2.replace(/\[([^\]]+)\]\((\/keepsake\/[^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s2 = s2.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    $("bookMsg").innerHTML = s2;
  } catch (e){ $("bookMsg").textContent = "失败了"; }
});

/* ---- 记忆 key → 人话 ---- */
const KLABEL = {
  "name": "称呼", "attitude": "态度", "mood": "心情",
  "daily_state": "今天的状态", "__global__": "全局",
  "profile": "关于他", "job": "工作", "age": "年龄",
};
function prettyKey(k){
  if (!k) return "";
  if (KLABEL[k]) return KLABEL[k];
  const i = k.indexOf(":");
  if (i > 0){
    const head = k.slice(0, i), tail = k.slice(i + 1);
    const map = { event: "事件", like: "喜欢", dislike: "讨厌",
                  plan: "打算", moment: "时刻", fact: "事实",
                  promise: "说好的" };
    const label = map[head] || head;
    if (/[\u4e00-\u9fff]/.test(tail)) return label;
    return label + (tail ? " " + tail : "");
  }
  return k;
}

loadMiles();
loadMine();
loadStory();

load();
</script>
</body>
</html>
