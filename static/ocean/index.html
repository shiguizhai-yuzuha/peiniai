  /* ---------- remove a creature (right-click / long press) ---------- */
  function screenPointOf(pos){
    const p=pos.clone().project(camera);
    return {x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight};
  }
  function pickCreatureAt(cx,cy){
    const th=Math.max(22,Math.min(58,Math.min(innerWidth,innerHeight)*.072));
    let best=null,bestD=1e9;
    for(const j of jellies){
      const p=screenPointOf(j.pos); const d=Math.hypot(p.x-cx,p.y-cy);
      if(d<th*1.15 && d<bestD){ best=j; bestD=d; }
    }
    for(const r of rays){
      const p=screenPointOf(r.pos); const d=Math.hypot(p.x-cx,p.y-cy);
      if(d<th*1.35 && d<bestD){ best=r; bestD=d; }
    }
    return best;
  }
  function removeCreature(c){
    if(!c) return false;
    if(c.kind==='ray'){
      const bi=rayByType[c.key].indexOf(c); if(bi<0 && !rays.includes(c)) return false;
      if(bi>=0) rayByType[c.key].splice(bi,1);
      const ri=rays.indexOf(c); if(ri>=0) rays.splice(ri,1);
    }else{
      const ji=jellies.indexOf(c); if(ji<0) return false;
      jellies.splice(ji,1);
      scene.remove(c.group);
      const ud=c.group.userData;
      [ud.bellMat,ud.tentMat,ud.glowMat].forEach(m=>{ if(m&&m.dispose) m.dispose(); });
    }
    addWaterDrop(c.pos.x,c.pos.z,.22);
    spawnRing(c.pos.x,c.pos.z,.18,1.8,1.0,.25,0xd9fff5);
    updateCounter();
    toast('已移回深海 · 还剩 '+totalCreatures()+' 只');
    return true;
  }
  let deleteHold=null;
  function cancelDeleteHold(){ if(deleteHold){ clearTimeout(deleteHold.timer); deleteHold=null; } }
  function armDeleteHold(e){
    cancelDeleteHold();
    const target=pickCreatureAt(e.clientX,e.clientY);
    if(!target) return;
    deleteHold={x:e.clientX,y:e.clientY,target,timer:setTimeout(()=>{
      if(deleteHold && deleteHold.target===target){ deleteHold=null; removeCreature(target); }
    },700)};
  }
  canvas.addEventListener('contextmenu',e=>{
    e.preventDefault();
    const target=pickCreatureAt(e.clientX,e.clientY);
    if(target) removeCreature(target);
    else toast('这里没有可移除的生物');
  });
  canvas.addEventListener('pointerdown',e=>{
    if(e.button!==undefined && e.button!==0) return;
    e.preventDefault();
    const wp=pointerGround(e.clientX,e.clientY,0);
    lastPointer.x=e.clientX; lastPointer.y=e.clientY;
    if(envTarget.whirl>.5){
      whirlCenter.x=clamp(wp.x,-40,40); whirlCenter.y=clamp(wp.z,-26,26);
      waterDrag={active:true,whirl:true,pointerId:e.pointerId};
      document.body.classList.add('grabbing');
      addWaterDrop(wp.x,wp.z,.35);
      spawnRing(wp.x,wp.z,.2,2.4,1.0,.22,0xcffff7);
    }else{
      waterDrag={active:true,whirl:false,pointerId:e.pointerId};
      disturbWater(wp.x,wp.z,true);
      armDeleteHold(e);
    }
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  });
  canvas.addEventListener('pointermove',e=>{
    if(deleteHold && Math.hypot(e.clientX-deleteHold.x,e.clientY-deleteHold.y)>9) cancelDeleteHold();
    if(!waterDrag||!waterDrag.active) return;
    const wp=pointerGround(e.clientX,e.clientY,0);
    if(waterDrag.whirl){
      whirlCenter.x=clamp(wp.x,-40,40); whirlCenter.y=clamp(wp.z,-26,26);
      if(performance.now()-lastWaterRipple>60){ addWaterDrop(wp.x,wp.z,.12); lastWaterRipple=performance.now(); }
    }else{
      if(performance.now()-lastWaterRipple>55){ addWaterDrop(wp.x,wp.z,.09); lastWaterRipple=performance.now(); }
    }
  });
  canvas.addEventListener('pointerup',()=>{ cancelDeleteHold(); waterDrag=null; document.body.classList.remove('grabbing'); });
  canvas.addEventListener('pointercancel',()=>{ cancelDeleteHold(); waterDrag=null; document.body.classList.remove('grabbing'); });
  document.body.style.cursor='default';

  /* ---------- thumbnails rendered from the actual 3D models ---------- */
  function renderThumbnails(){
    let tr;
    try{
      tr=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true,powerPreference:'low-power'});
    }catch(err){
      console.warn('thumbnail renderer unavailable',err); return;
    }
    tr.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
    tr.setSize(460,310,false);
    tr.setClearColor(0x000000,0);
    tr.autoClear=true;
    const s=new THREE.Scene();
    const cam=new THREE.PerspectiveCamera(31,460/310,.1,80);
    const imgs=[...document.querySelectorAll('.card .thumb img')];
    const pvObj=new THREE.Object3D();
    function capture(name,obj,camPos,lookAt,fov=31){
      s.clear();
      s.add(obj);
      cam.fov=fov; cam.aspect=460/310; cam.position.copy(camPos); cam.lookAt(lookAt); cam.updateProjectionMatrix();
      tr.render(s,cam);
      const url=tr.domElement.toDataURL('image/png');
      const data=CARD_DATA.find(c=>c.key===name);
      const card=document.querySelector(`.card[data-key="${name}"]`);
      const img=card?card.querySelector('img'):null;
      if(img){ img.onload=()=>img.classList.add('loaded'); img.src=url; }
      s.remove(obj);
    }
    try{
      for(const type of ['manta','eagle','sting']){
        const def=RAY_DEF[type];
        const bMat=makeRayBodyMaterial(type,2);
        const tMat=makeRayTailMaterial(type,2);
        bMat.uniforms.uTime.value=1.2; tMat.uniforms.uTime.value=1.2;
        const body=new THREE.InstancedMesh(rayAssets[type].geom,bMat,1);
        const tail=new THREE.InstancedMesh(rayAssets[type].tailGeom,tMat,1);
        body.frustumCulled=false; tail.frustumCulled=false;
        pvObj.position.set(0,0,0); pvObj.rotation.set(.035,.22,.02); pvObj.scale.setScalar(1.08); pvObj.updateMatrix();
        body.setMatrixAt(0,pvObj.matrix); tail.setMatrixAt(0,pvObj.matrix);
        body.instanceMatrix.needsUpdate=true; tail.instanceMatrix.needsUpdate=true;
        const group=new THREE.Group(); group.add(body,tail);
        capture(type,group,new THREE.Vector3(0,6.9,6.7),new THREE.Vector3(0,-.35,.15),33);
        bMat.dispose(); tMat.dispose();
      }
      for(const type of ['moon','nettle']){
        const group=createJellyVisual(type);
        const scale=type==='moon'?1.28:1.02;
        group.scale.setScalar(scale);
        group.position.y=.55;
        group.rotation.set(.10,.25,.03);
        const ud=group.userData;
        ud.bellMat.uniforms.uTime.value=1.4; ud.bellMat.uniforms.uPulse.value=.2;
        ud.tentMat.uniforms.uTime.value=1.4; ud.tentMat.uniforms.uPulse.value=.2;
        ud.bell.scale.set(.98,1.02,.98);
        capture(type,group,new THREE.Vector3(0,4.3,8.8),new THREE.Vector3(0,-.85,0),34);
        ud.bellMat.dispose(); ud.tentMat.dispose(); if(ud.glowMat) ud.glowMat.dispose();
      }
    }catch(err){ console.warn('thumbnail capture failed',err); }
    tr.dispose();
    try{ tr.forceContextLoss(); }catch(e){}
  }

  /* ---------- initial scene ---------- */
  function seedScene(){
    spawnRay('manta',{pos:new THREE.Vector2(-9.5,-8.0),heading:.52});
    spawnRay('manta',{pos:new THREE.Vector2(12,4.2),heading:-1.15});
    spawnRay('eagle',{pos:new THREE.Vector2(21,4.4),heading:1.25});
    spawnRay('sting',{pos:new THREE.Vector2(5.5,-4.2),heading:-2.1});
    spawnJelly('moon',{pos:new THREE.Vector2(12,4.8)});
    spawnJelly('moon',{pos:new THREE.Vector2(26,8.2)});
    spawnJelly('moon',{pos:new THREE.Vector2(-4,-2.5)});
    spawnJelly('nettle',{pos:new THREE.Vector2(17,1.6)});
    spawnJelly('nettle',{pos:new THREE.Vector2(4,-5.5)});
    updateCounter();
  }
  seedScene();
  window.__stage('正在放归生灵');

  /* ---------- resize ---------- */
  window.addEventListener('resize',()=>{
    applyRendererSize();
    resizeRainCanvas();
  });
  window.addEventListener('orientationchange',()=>{
    setTimeout(()=>{ applyRendererSize(); resizeRainCanvas(); },220);
  });

  /* ---------- adaptive quality ---------- */
  function setQuality(level){
    quality.level=clamp(level,0,3);
    const settings=[
      {scale:1.0,under:.82,dprCap:1.65},
      {scale:.9,under:.72,dprCap:1.4},
      {scale:.78,under:.64,dprCap:1.2},
      {scale:.66,under:.56,dprCap:1.0}
    ][quality.level];
    quality.scale=settings.scale; quality.underScale=settings.under; quality.dprCap=settings.dprCap;
    DIAG.quality=quality.level;
    applyRendererSize();
    resizeRainCanvas();
  }
  let fpsFrames=0,fpsTime=0,measuredFPS=60,goodTime=0,badWindows=0;
  function monitorQuality(dt){
    fpsFrames++; fpsTime+=dt;
    if(fpsTime>2.0){
      measuredFPS=fpsFrames/fpsTime;
      DIAG.fps=Math.round(measuredFPS);
      if(measuredFPS<42){
        badWindows++; goodTime=0;
        if(badWindows>=2 && quality.level<3){ setQuality(quality.level+1); badWindows=0; }
      }else{
        badWindows=0;
        if(measuredFPS>58){ goodTime+=fpsTime; if(goodTime>6 && quality.level>0){ setQuality(quality.level-1); goodTime=0; } }
        else goodTime=0;
      }
      fpsFrames=0; fpsTime=0;
    }
  }

  /* ---------- render loop ---------- */
  let simAcc=0;
  const simState={read:0};
  function simulateStep(delta){
    simUniforms.uTime.value=state.time;
    simUniforms.uDelta.value=delta;
    let n=0;
    while(n<8 && rippleQueue.length){
      const d=rippleQueue.shift();
      simDrops[n].set(d.u,d.v,d.s);
      n++;
    }
    simUniforms.uDropCount.value=n;
    simUniforms.uState.value=simRT[simRead].texture;
    renderer.setRenderTarget(simRT[1-simRead]);
    renderer.render(simScene,simCam);
    simRead=1-simRead;
    waterUniforms.uRipple.value=simRT[simRead].texture;
  }
  let lastFrame=performance.now()/1000;
  let firstFrame=true;
  let diagTimer=0;
  let frameNo=0;

  function handleFrameError(err){
    const msg=(err&&err.stack)||String(err);
    if(!window.__FRAME_ERR__){
      window.__FRAME_ERR__=msg;
      DIAG.errors.push('frame: '+msg);
      const d=$('diag'); if(d){ d.classList.add('show'); d.textContent='FRAME ERROR\n'+msg+'\n\n'+(DIAG.errors||[]).join('\n'); }
      $('fatal').classList.add('show');
      const fm=$('fatalMsg'); if(fm) fm.textContent=msg;
    }
  }
  function frame(nowMs){
    requestAnimationFrame(frame);
    try{
    if(frameNo===0) window.__stage('正在渲染第一帧');
    const tnow=nowMs/1000;
    let dt=tnow-lastFrame; lastFrame=tnow;
    if(!isFinite(dt)||dt<0) dt=1/60;
    dt=Math.min(dt,.05);
    state.time+=dt;
    const time=state.time;

    updateEnvironment(dt,time);
    updateSwash(dt,time);
    // fixed-ish simulation cadence
    simAcc=Math.min(simAcc+dt,.06);
    let steps=0;
    while(simAcc>=1/60 && steps<2){ simulateStep(1/60); simAcc-=1/60; steps++; }
    if(steps===0){ /* keep last surface texture */ }
    updateRays(dt,time);
    updateJellies(dt,time);
    syncRayInstances(time);
    syncJellyInstances(time);
    updateRings(dt);
    updateParticleField(droplets,dt);
    updateParticleField(silts,dt);
    drawRain(dt);
    monitorQuality(dt);
    oceanSound.update(swash.value,env.rain);

    // uniforms
    waterUniforms.uTime.value=time;
    waterUniforms.uCalm.value=env.calm;
    waterUniforms.uClear.value=env.clear;
    waterUniforms.uRain.value=env.rain;
    waterUniforms.uWhirl.value=env.whirl;
    waterUniforms.uWhirlCenter.value.copy(whirlCenter);
    waterUniforms.uUnder.value=underRT.texture;
    beachUniforms.uTime.value=time;
    droplets.mat.uniforms.uScale.value=canvasSize.height*.82;
    silts.mat.uniforms.uScale.value=canvasSize.height*.82;
    vortexSprite.position.set(whirlCenter.x,.12,whirlCenter.y);
    vortexSprite.scale.setScalar(10.8+Math.sin(time*.55)*.8);
    vortexMat.opacity=env.whirl*.48;
    vortexMat.rotation=time*.24;
    vortexSprite.visible=env.whirl>.015;

    // underwater pass (refraction source)
    renderer.setRenderTarget(underRT);
    renderer.setClearColor(0x07333f,1);
    renderer.clear(true,true,true);
    camera.layers.set(underLayer);
    renderer.render(scene,camera);
    // above-water pass
    renderer.setRenderTarget(null);
    renderer.setClearColor(0x052832,1);
    renderer.clear(true,true,true);
    camera.layers.set(aboveLayer);
    renderer.render(scene,camera);

    if(firstFrame){
      firstFrame=false;
      DIAG.ready=true;
      document.body.dataset.ready='1';
      window.__stage('准备就绪');
      $('loader').classList.add('is-gone');
      setTimeout(renderThumbnails,420);
      setTimeout(()=>{ const h=$('hint'); if(h) h.style.opacity='0'; },12000);
    }
    frameNo++;
    diagTimer+=dt;
    if(DEBUG && diagTimer>1.0){
      diagTimer=0;
      const errs=DIAG.errors.slice(-4).join('\n')||'none';
      $('diag').textContent=
        `Ocean Shallows · ${canvasSize.width}×${canvasSize.height} @${pixelRatio.toFixed(2)}\n`+
        `GL ${DIAG.gl}\nFPS ${DIAG.fps} · quality ${quality.level} · under ${quality.underScale}\n`+
        `${DIAG.counts} · time ${time.toFixed(1)}s\n`+
        `errors: ${errs}`;
    }
    }catch(err){ handleFrameError(err); }
  }

  // Make keyboard/focus behaviour explicit and start the tide.
  $('scene').setAttribute('tabindex','-1');
  document.documentElement.style.background='#052831';
  window.__OCEAN__={
    renderer,scene,camera,rays,jellies,env,envTarget,state,spawnRay,spawnJelly,
    setRain,setWhirl,setCalm,setClear,setSound,setUIHidden,toast,totalCreatures,
    setQuality,diag:DIAG,waterUniforms,beachUniforms,simUniforms,rayAssets,quality,
    whirlCenter
  };
  requestAnimationFrame(frame);
})();
</script>
<script src="scene.js"></script>
</body>
</html>
