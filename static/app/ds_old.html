<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>直连 DeepSeek</title>
<style>
  :root{ --bg:#0b0f14; --panel:#12171e; --line:rgba(239,233,225,.10);
         --ink:#efe9e1; --dim:rgba(239,233,225,.55); --warm:#ffb98a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Microsoft YaHei",sans-serif;height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  header .t{font-size:14px;letter-spacing:.06em}
  header .warn{font-size:11.5px;color:var(--dim);margin-left:auto}
  #list{height:100%}
  main{flex:1;overflow:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:14px}
  .m{max-width:78%;padding:10px 14px;border-radius:12px;line-height:1.75;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
  .m.me{align-self:flex-end;background:#8fe3a8;color:#12301c}
  .m.ai{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line)}
  .m.sys{align-self:center;color:var(--dim);font-size:12px;background:none}
  #bar{display:flex;gap:8px;padding:10px 14px 16px;border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;height:52px;background:rgba(255,255,255,.04);color:var(--ink);
           border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;
           font-family:inherit}
  button{width:56px;border:none;border-radius:10px;background:linear-gradient(135deg,#ffb98a,#ff9a6a);
         color:#241208;font-size:14px;cursor:pointer;font-weight:600}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<header>
  <span class="t">直连 DeepSeek</span>
  <span class="warn">这不是她 · 通用助手 · 不记记忆</span>
</header>
<main id="main"></main>
<div id="bar">
  <textarea id="inp" placeholder="问点什么……（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</div>
<script>
const main = document.getElementById("main");
const inp = document.getElementById("inp");
const btn = document.getElementById("send");
let history = [];

function add(role, text){
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "me" : role === "sys" ? "sys" : "ai");
  d.textContent = text;
  main.appendChild(d);
  main.scrollTop = main.scrollHeight;
  return d;
}

async function send(){
  const text = inp.value.trim();
  if (!text) return;
  inp.value = "";
  add("user", text);
  history.push({ role: "user", content: text });

  const box = add("ai", "……");
  btn.disabled = true;
  try {
    const r = await fetch("/api/ds", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ u: localStorage.getItem("pn_uid") || "", messages: history })
    });
    const d = await r.json();
    if (d.ok){
      box.textContent = d.text || "（空）";
      history.push({ role: "assistant", content: d.text || "" });
    } else {
      box.textContent = d.error || "出错了";
      box.className = "m sys";
    }
  } catch(e){
    box.textContent = "出错了：" + e.message;
    box.className = "m sys";
  }
  btn.disabled = false;
  main.scrollTop = main.scrollHeight;
}

btn.addEventListener("click", send);
inp.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
</script>
</body>
</html>
