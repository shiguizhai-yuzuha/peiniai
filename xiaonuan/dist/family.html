<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家人端 · 小暖</title>
<style>
  :root{
    --ink:#1f2329; --sub:#646a73; --mute:#8f959e;
    --line:#e6e8ec; --blue:#4e6ef2; --bg:#f5f6f8; --card:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:20px/1.6 "Microsoft YaHei","PingFang SC",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 40px}
  .blk{background:var(--card);border-radius:16px;padding:22px 20px;margin-bottom:14px}
  .concl{padding:26px 20px}
  .concl p{margin:0;font-size:22px;font-weight:700;line-height:1.5;color:var(--ink)}
  .concl .cnote{margin:10px 0 0;font-size:17px;font-weight:400;color:var(--mute)}
  .concl .cnote[hidden]{display:none}
  .date{font-size:16px;color:var(--mute);margin-bottom:12px}
  .nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .num{text-align:center}
  .num b{display:block;font-size:32px;line-height:1.2;font-weight:700}
  .num span{display:block;font-size:18px;color:var(--ink);margin-top:2px}
  .num small{display:block;font-size:14px;line-height:1.45;color:var(--mute);margin-top:4px}
  .lbl{display:block;font-size:16px;color:var(--mute);margin:18px 0 8px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{display:inline-block;padding:5px 12px;border-radius:999px;
       background:#eef1fe;color:#3d55c7;font-size:17px;line-height:1.4}
  .muted{color:var(--mute);font-size:17px}
  .mi{display:flex;justify-content:space-between;align-items:baseline;
      padding:9px 0;border-bottom:1px solid var(--line);font-size:18px}
  .mi:last-child{border-bottom:0}
  .mi em{font-style:normal;color:var(--ink)}
  .mi b{font-weight:700;color:var(--blue)}
  .fix{margin-top:12px;padding:12px 14px;background:#f7f8fb;border-radius:12px}
  .fixh{font-size:15px;color:var(--mute);margin-bottom:6px}
  .fix p{margin:4px 0;font-size:17px;line-height:1.55;color:var(--ink)}
  /* 三块 */
  .b3{padding:16px;margin-bottom:24px}
  .b3h{font-size:16px;color:var(--mute);font-weight:600;margin:0 0 10px}
  .b3list{display:flex;flex-direction:column}
  .b3i{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
       padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.5;color:var(--ink)}
  .b3i:last-child{border-bottom:0}
  .b3i .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .b3i .n{font-size:14px;color:var(--blue);white-space:nowrap}
  .b3 .muted{font-size:15px}
  figure{margin:0 0 18px}
  figure:last-of-type{margin-bottom:0}
  figure img{display:block;width:100%;height:auto;border-radius:8px;
             background:#fff;border:1px solid var(--line)}
  figcaption{font-size:15px;line-height:1.5;color:var(--mute);margin-top:8px}
  footer{text-align:center;font-size:15px;color:var(--mute);padding:18px 8px 0}
  @media (max-width:420px){
    .wrap{padding:14px 10px 32px}
    .blk{padding:18px 14px}
    .nums{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 8px}
    .num b{font-size:30px}
  }
</style>
</head>
<body>
<main class="wrap">

  <section class="blk concl" aria-live="polite">
    <p id="headline">正在读…</p>
    <p id="crisisNote" class="cnote" hidden></p>
  </section>

  <section class="blk b3">
    <h2 class="b3h">她今天说了什么</h2>
    <div id="toldList" class="b3list"><div class="muted">正在读…</div></div>
  </section>

  <section class="blk b3">
    <h2 class="b3h">她记住了什么</h2>
    <div id="memTop" class="b3list"><div class="muted">正在读…</div></div>
  </section>

  <section class="blk b3">
    <h2 class="b3h">提醒</h2>
    <div id="remLine" class="b3list"><div class="muted">正在读…</div></div>
  </section>

  <section class="blk today">
    <div class="date" id="todayDate">今天</div>
    <div class="nums">
      <div class="num"><b id="nChats">–</b><span>说话</span><small>她说的和老人说的都算</small></div>
      <div class="num"><b id="nRems">–</b><span>提醒</span><small>到点发出的</small></div>
      <div class="num"><b id="nAcks">–</b><span>确认</span><small>她回了话，或点了知道了</small></div>
      <div class="num"><b id="nPro">–</b><span>主动开口</span><small>她自己先说起来的</small></div>
    </div>

    <span class="lbl">今天聊到</span>
    <div class="tags" id="topics"><span class="muted">正在读…</span></div>

    <span class="lbl">这周新记住的事</span>
    <div id="memList"><div class="muted">正在读…</div></div>
    <div class="fix" id="fixBox" hidden>
      <div class="fixh" id="fixHead">家人改过的</div>
      <div id="fixList"></div>
    </div>
  </section>

  <section class="blk charts">
    <figure>
      <img id="cWeek" alt="最近七天每天说话次数">
      <figcaption>最近 7 天，每天她说了几句话。</figcaption>
    </figure>
    <figure>
      <img id="cHours" alt="今天二十四小时说话分布">
      <figcaption>今天每个小时，她说了几句话。</figcaption>
    </figure>
    <figure>
      <img id="cAck" alt="今天提醒确认情况">
      <figcaption>今天发出的提醒，确认了多少。</figcaption>
    </figure>
  </section>

  <footer>数据来自小暖 · 不包含对话原文</footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const API = "/functions/v1/app";
const CRISIS = null;

(function gate(){
  fetch(API + "/auth/me", { cache: "no-store" }).then((r) => {
    if (r.status === 401){
      location.replace("/login.html?next=" + encodeURIComponent(location.pathname));
    }
  }).catch(() => {});
})();

async function api(path){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(API + path, { cache: "no-store", signal: ctrl.signal });
    if (r.status === 401){
      location.replace("/login.html?next=" + encodeURIComponent(location.pathname));
    }
    if (!r.ok) throw new Error("read");
    return await r.json();
  } finally { clearTimeout(t); }
}

function setNums(today){
  $("nChats").textContent = today.chats;
  $("nRems").textContent = today.reminders;
  $("nAcks").textContent = today.acks;
  $("nPro").textContent = today.proactive != null ? today.proactive : 0;
}

function renderTopics(list){
  const box = $("topics");
  box.textContent = "";
  if (!list || !list.length){
    const s = document.createElement("span");
    s.className = "muted";
    s.textContent = "今天没说太多";
    box.appendChild(s);
    return;
  }
  list.forEach(t => {
    const el = document.createElement("span");
    el.className = "tag";
    el.textContent = t;
    box.appendChild(el);
  });
}

function renderMem(cats){
  const box = $("memList");
  box.textContent = "";
  if (!cats || !cats.length){
    const s = document.createElement("div");
    s.className = "muted";
    s.textContent = "这周还没记住新的事。";
    box.appendChild(s);
    return;
  }
  cats.forEach(x => {
    const row = document.createElement("div");
    row.className = "mi";
    const a = document.createElement("em");
    a.textContent = x.label;
    const b = document.createElement("b");
    b.textContent = x.count + " 次";
    row.appendChild(a);
    row.appendChild(b);
    box.appendChild(row);
  });
}

function renderFix(list, total){
  const box = $("fixBox");
  const head = $("fixHead");
  const body = $("fixList");
  body.textContent = "";
  if (!list || !list.length){
    box.hidden = true;
    return;
  }
  head.textContent = "家人改过的 " + (total || list.length) + " 条";
  list.forEach(x => {
    const p = document.createElement("p");
    p.textContent = "“" + x + "”";
    body.appendChild(p);
  });
  box.hidden = false;
}

function bjDayStart(){
  const t = new Date(Date.now() + 8 * 3600 * 1000);
  return Date.UTC(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()) - 8 * 3600 * 1000;
}
function b3empty(box, text){
  const s = document.createElement("div");
  s.className = "muted";
  s.textContent = text;
  box.appendChild(s);
}
function b3row(text, num){
  const row = document.createElement("div");
  row.className = "b3i";
  const a = document.createElement("span");
  a.className = "t";
  a.textContent = text;
  row.appendChild(a);
  if (num){
    const b = document.createElement("span");
    b.className = "n";
    b.textContent = num;
    row.appendChild(b);
  }
  return row;
}
async function loadThree(){
  const told = $("toldList"), top = $("memTop");
  try {
    const d = await api("/memories");
    const items = (d && d.items) || [];
    const day0 = bjDayStart();

    told.textContent = "";
    const todayItems = items.filter(function(i){ return Number(i.ts || 0) >= day0; }).slice(0, 3);
    if (!todayItems.length){
      b3empty(told, "今天还没说话");
    } else {
      todayItems.forEach(function(i){
        const t = String(i.text || "");
        told.appendChild(b3row(t.length > 30 ? t.slice(0, 30) + "…" : t, ""));
      });
    }

    top.textContent = "";
    if (!items.length){
      b3empty(top, "她还没记住什么。");
    } else {
      items.slice(0, 5).forEach(function(i){
        top.appendChild(b3row(String(i.text || ""), "说过 " + (Number(i.times) || 1) + " 次"));
      });
    }
  } catch(e){
    told.textContent = "";
    b3empty(told, "读取失败，稍后再试");
    top.textContent = "";
    b3empty(top, "读取失败，稍后再试");
  }
}
function paintRem(d){
  const box = $("remLine");
  box.textContent = "";
  const t = d && d.today;
  const n = Number((t && t.reminders) || 0);
  const m = Number((t && t.acks) || 0);
  if (!n && !m){
    b3empty(box, "今天还没有提醒");
  } else {
    box.appendChild(b3row("今天提醒 " + n + " 次，完成 " + m + " 次", ""));
  }
}

async function load(){
  loadThree();
  $("cWeek").src = API + "/family_chart?name=week";
  $("cHours").src = API + "/family_chart?name=hours";
  $("cAck").src = API + "/family_chart?name=ack";

  try {
    const d = await api("/family/summary");
    $("todayDate").textContent = d.today.date;
    setNums(d.today);
    renderTopics(d.today.topics);
    renderMem(d.week_mem);
    renderFix(d.week_corrected, d.corrected_n);
    paintRem(d);
    $("headline").textContent =
      (CRISIS && CRISIS.headline) || d.headline;
    const note = (CRISIS && CRISIS.note) || d.crisis_note || "";
    $("crisisNote").textContent = note;
    $("crisisNote").hidden = !note;
  } catch (e){
    $("headline").textContent = (CRISIS && CRISIS.headline)
      || "这会儿读不到，等会儿刷新一下。";
    $("topics").textContent = "";
    $("memList").textContent = "";
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
