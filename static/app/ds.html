<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DeepSeek</title>
<style>
  :root{
    --bg:#0d0f12; --side:#131619; --line:#242a30; --text:#e8eaed; --dim:#8b929b;
    --brand:#4d6bfe; --bubble:#1b1f24; --code:#0a0c0f;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  #app{display:flex;height:100%}

  #side{width:260px;flex:0 0 260px;background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:10px}
  .brand{display:flex;align-items:center;gap:8px;padding:8px 8px 12px;font-size:15px;font-weight:600}
  .brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#4d6bfe,#7c5cff);display:block}
  #newBtn{display:flex;align-items:center;gap:8px;margin:0 4px 10px;padding:10px 12px;border-radius:10px;
    background:#1c2026;border:1px solid var(--line);cursor:pointer;font-size:13px;color:var(--text)}
  #newBtn:hover{background:#232830}
  #list{flex:1;overflow:auto;padding:0 4px}
  .item{padding:9px 10px;border-radius:9px;font-size:13px;color:#c6cbd2;cursor:pointer;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
  .item:hover{background:#1b2026}
  .item.on{background:#232a33;color:#fff}
  .item .x{margin-left:auto;opacity:0;font-size:12px;color:#7b828a}
  .item:hover .x{opacity:1}
  .side-foot{border-top:1px solid var(--line);padding:10px 8px 4px;font-size:12px;color:var(--dim)}

  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #top{height:52px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line)}
  #title{font-size:14px;color:#cfd4da;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  select,button{font-family:inherit}
  #model{background:#1b2026;color:#dfe3e8;border:1px solid var(--line);border-radius:8px;
    padding:6px 8px;font-size:12.5px;outline:none}
  #stream{overflow:auto;flex:1;padding:26px 0 200px}
  .wrap{max-width:780px;margin:0 auto;padding:0 20px}
  .row{display:flex;gap:12px;margin-bottom:22px}
  .row.user{justify-content:flex-end}
  .avatar{width:28px;height:28px;border-radius:8px;flex:0 0 28px;display:flex;align-items:center;
    justify-content:center;font-size:12px;background:#232a33;color:#aeb6bf}
  .user .avatar{background:#2a3550;color:#c8d4ff}
  .bubble{max-width:100%;line-height:1.75;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .row.user .bubble{background:var(--bubble);padding:12px 16px;border-radius:14px}
  .bubble code{background:var(--code);padding:2px 6px;border-radius:5px;font-size:13.5px;
    font-family:ui-monospace,Consolas,monospace;color:#9fd0ff}
  .bubble pre{position:relative;background:var(--code);border:1px solid var(--line);border-radius:10px;
    padding:14px 14px 12px;overflow:auto;margin:12px 0}
  .bubble pre code{background:none;padding:0;color:#d7e3f0;font-size:13px;line-height:1.65}
  .copy{position:absolute;right:8px;top:8px;font-size:11px;color:#8b929b;background:#161a1f;
    border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer;opacity:0;transition:.15s}
  pre:hover .copy{opacity:1}
  .think{border-left:2px solid #2f3a48;margin:2px 0 12px;padding:6px 0 6px 12px}
  .think summary{font-size:12.5px;color:#8b929b;cursor:pointer;user-select:none;list-style:none}
  .think summary::-webkit-details-marker{display:none}
  .think summary::before{content:"▸ ";color:#6b737d}
  .think[open] summary::before{content:"▾ "}
  .think .body{font-size:13px;color:#8f97a1;line-height:1.7;white-space:pre-wrap;margin-top:8px;
    max-height:260px;overflow:auto}
  .cursor{display:inline-block;width:8px;height:16px;background:var(--brand);margin-left:2px;
    animation:blink 1s steps(2) infinite;vertical-align:-2px}
  @keyframes blink{50%{opacity:0}}

  #composer{position:fixed;left:260px;right:0;bottom:0;padding:14px 0 18px;
    background:linear-gradient(180deg,rgba(13,15,18,0),var(--bg) 40%)}
  #cwrap{max-width:780px;margin:0 auto;padding:0 20px}
  #box{background:#151a20;border:1px solid var(--line);border-radius:16px;padding:12px 12px 8px}
  #box:focus-within{border-color:#3a4657}
  #input{width:100%;min-height:44px;max-height:200px;background:none;border:none;outline:none;
    resize:none;color:var(--text);font-size:15px;line-height:1.6}
  #tools{display:flex;align-items:center;gap:10px;margin-top:6px}
  .tg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#9aa3ad;cursor:pointer;
    border:1px solid var(--line);border-radius:20px;padding:5px 12px;user-select:none}
  .tg.on{color:#cfd9ff;border-color:#3d4f8f;background:#1a2030}
  .tg input{display:none}
  #send{margin-left:auto;width:34px;height:34px;border-radius:10px;border:none;
    background:var(--brand);color:#fff;font-size:16px;cursor:pointer}
  #send:disabled{opacity:.35;cursor:default}
  #hint{max-width:780px;margin:8px auto 0;padding:0 20px;font-size:11.5px;color:#666d76}
  #empty{max-width:780px;margin:0 auto;padding:80px 20px 0;text-align:center}
  #empty h1{font-size:26px;font-weight:600;margin:0 0 10px}
  #empty p{color:var(--dim);font-size:13.5px;margin:0}
  .chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
  .chip{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:#c3c9d1;
    cursor:pointer;background:#141a20}
  .chip:hover{border-color:#3a4657}
  .err{color:#ff8a8a;font-size:13px}
  .acts{display:flex;gap:6px;margin-top:6px;opacity:0;transition:.15s}
  .row:hover .acts{opacity:1}
  .acts button{font-size:11.5px;color:#8b929b;background:none;border:1px solid var(--line);
    border-radius:6px;padding:2px 8px;cursor:pointer}
  .acts button:hover{color:#cfd6df;border-color:#3a4657}
  .editbox{width:100%;background:#151a20;border:1px solid #3a4657;border-radius:10px;
    color:var(--text);font-size:15px;line-height:1.6;padding:10px 12px;resize:vertical;min-height:64px}
  .edits{display:flex;gap:8px;margin-top:8px}
  .edits button{font-size:12.5px;padding:5px 12px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:#1b2026;color:#cfd6df}
  .edits .p{background:var(--brand);border-color:var(--brand);color:#fff}
  #bal{font-size:12.5px;color:#9aa3ad;border:1px solid var(--line);border-radius:8px;
    padding:5px 10px;white-space:nowrap}
  #bal b{color:#e8eaed;font-weight:600}
  select.mini{background:#1b2026;color:#cfd6df;border:1px solid var(--line);border-radius:18px;
    padding:5px 8px;font-size:12.5px;outline:none;cursor:pointer}
  select.mini:hover{border-color:#3a4657}
  .fchip img{width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:4px}
  .fchip{font-size:12px;color:#c3c9d1;background:#1b2026;border:1px solid var(--line);
    border-radius:8px;padding:4px 9px}
  @media (max-width:820px){
    #side{display:none}
    #composer{left:0}
    #top{padding:0 12px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><i></i>DeepSeek</div>
    <div id="newBtn">＋ 新对话</div>
    <div id="list"></div>
    <div class="side-foot">对话只保存在你自己的账户下</div>
  </aside>

  <main id="main">
    <div id="top">
      <div id="title">新对话</div>
      <div id="bal">余额 —</div>
    </div>

    <div id="stream">
      <div id="empty">
        <h1>有什么可以帮你的？</h1>
        <p>和她无关 —— 这是通用助手，不记记忆，也不扮演任何人。</p>
        <div class="chips">
          <div class="chip">写一段 Python 脚本</div>
          <div class="chip">解释一个概念</div>
          <div class="chip">帮我改一段文案</div>
        </div>
      </div>
      <div class="wrap" id="msgs"></div>
    </div>
  </main>
</div>

<div id="composer">
  <div id="cwrap">
    <div id="box">
      <textarea id="input" rows="1" placeholder="给 DeepSeek 发送消息（Enter 发送 / Shift+Enter 换行）"></textarea>
      <div id="tools">
        <select id="model" class="mini">
          <option value="flash">Flash · 快</option>
          <option value="pro" selected>Pro · 强</option>
          <option value="r1">R1 · 推理</option>
        </select>
        <select id="level" class="mini">
          <option value="off" selected>推理 关</option>
          <option value="low">推理 低</option>
          <option value="mid">推理 中</option>
          <option value="high">推理 高</option>
        </select>
        <select id="tier" class="mini">
          <option value="auto" selected>上下文 自动</option>
          <option value="short">上下文 8k</option>
          <option value="mid">上下文 24k</option>
          <option value="long">上下文 48k</option>
          <option value="max">上下文 96k</option>
          <option value="custom">上下文 自定义</option>
        </select>
        <input id="tierCustom" class="mini" type="number" min="2" max="400"
               placeholder="k 字" style="width:74px;display:none">
        <label class="tg" id="searchTg"><input type="checkbox" id="search">联网</label>
        <label class="tg" id="fileTg">＋ 文件<input type="file" id="file" hidden accept="image/*,.txt,.md,.py,.json,.csv,.docx,.pdf"></label>
        <button id="send">↑</button>
      </div>
    </div>
    <div id="files" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
    <div id="hint">内容由 AI 生成，请自行判断</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const uid = localStorage.getItem("pn_uid") || localStorage.getItem("u") || "";

let curId = null, curTitle = "新对话", busy = false, msgs = [], balance = 0;
const FILES = [];

async function api(path, body){
  const r = await fetch(path, body ? {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  } : {});
  return r.json();
}

function esc(s){
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function deLatex(s){
  // 页面上没有公式渲染，把常见的 LaTeX 换成能读的文本
  let t = s;
  t = t.replace(/\\\[([\s\S]*?)\\\]/g, "\n$1\n").replace(/\\\(([\s\S]*?)\\\)/g, "$1");
  t = t.replace(/\$\$([\s\S]*?)\$\$/g, "\n$1\n").replace(/\$([^$\n]+)\$/g, "$1");
  t = t.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, "($1/$2)");
  t = t.replace(/\\dfrac\{([^{}]+)\}\{([^{}]+)\}/g, "($1/$2)");
  t = t.replace(/\\text\{([^{}]*)\}/g, "$1");
  t = t.replace(/\\boxed\{([^{}]*)\}/g, "**$1**");
  t = t.replace(/\\times/g, "×").replace(/\\div/g, "÷")
       .replace(/\\cdot/g, "·").replace(/\\approx/g, "≈").replace(/\\le/g, "≤")
       .replace(/\\ge/g, "≥").replace(/\\rightarrow/g, "→").replace(/\\to/g, "→");
  t = t.replace(/\\left|\\right/g, "");
  t = t.replace(/\\\\/g, "\n");
  t = t.replace(/\\[,;:!]/g, " ").replace(/\\!/g, "");
  t = t.replace(/\^\{2\}/g, "²").replace(/\^2/g, "²").replace(/\^3/g, "³");
  return t;
}

function md(s){
  let t = esc(deLatex(s));
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    return '<pre><button class="copy">复制</button><code>' + code.replace(/\n$/, "") + '</code></pre>';
  });
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return t;
}

function render(){
  const box = $("msgs");
  box.innerHTML = "";
  $("empty").style.display = msgs.length ? "none" : "block";
  msgs.forEach((m, idx) => {
    const row = document.createElement("div");
    row.className = "row " + (m.role === "user" ? "user" : "ai");
    if (m._editing){
      row.innerHTML = '<div class="avatar">你</div><div class="bubble">' +
        '<textarea class="editbox" id="editBox">' + esc(m.content) + '</textarea>' +
        '<div class="edits"><button class="p" id="editSave">保存并重发</button>' +
        '<button id="editCancel">取消</button></div></div>';
      box.appendChild(row);
      document.getElementById("editSave").onclick = () => saveEdit(idx);
      document.getElementById("editCancel").onclick = () => { m._editing = false; render(); };
      return;
    }
    const think = (m.role !== "user" && m.reasoning)
      ? '<details class="think"' + (m._open ? " open" : "") + '>' +
        '<summary>已深度思考</summary>' +
        '<div class="body">' + esc(m.reasoning) + '</div></details>'
      : '';
    const acts = m.role === "user"
      ? '<div class="acts"><button data-act="edit" data-i="' + idx + '">修改</button></div>'
      : '<div class="acts"><button data-act="regen" data-i="' + idx + '">重新生成</button></div>';
    row.innerHTML =
      '<div class="avatar">' + (m.role === "user" ? "你" : "DS") + '</div>' +
      '<div><div class="bubble">' + think +
      (m.role === "user" ? esc(m.content) : md(m.content)) + '</div>' + acts + '</div>';
    box.appendChild(row);
  });
  box.querySelectorAll("[data-act]").forEach(b => {
    b.onclick = () => {
      const i = Number(b.dataset.i);
      if (b.dataset.act === "edit"){ msgs[i]._editing = true; render(); }
      else regenerate(i);
    };
  });
  box.querySelectorAll(".copy").forEach(b => {
    b.onclick = () => {
      const code = b.parentElement.querySelector("code").innerText;
      navigator.clipboard.writeText(code);
      b.textContent = "已复制";
      setTimeout(() => b.textContent = "复制", 1200);
    };
  });
  scrollBottom();
}

function scrollBottom(){
  const s = $("stream");
  s.scrollTop = s.scrollHeight;
}

async function loadBalance(){
  const d = await api("/api/ds/balance?u=" + encodeURIComponent(uid));
  if (d.ok){
    balance = d.balance;
    $("bal").innerHTML = '余额 <b>¥' + Number(d.balance).toFixed(2) + '</b>';
  }
}

async function loadFiles(){
  if (!curId) { $("files").innerHTML = ""; return; }
  const d = await api("/api/ds/fs?u=" + encodeURIComponent(uid) + "&id=" + encodeURIComponent(curId));
  $("files").innerHTML = "";
  (d.items || []).forEach(f => {
    const s = document.createElement("span");
    s.className = "fchip";
    s.textContent = (f.kind === "image" ? "🖼 " : "") + f.name +
                    (f.kind === "image" ? "" : "（" + Math.round(f.n / 1000) + "k字）");
    $("files").appendChild(s);
  });
}

async function loadConvos(){
  const d = await api("/api/ds/convos?u=" + encodeURIComponent(uid));
  const list = $("list");
  list.innerHTML = "";
  if (!d.ok){ list.innerHTML = '<div class="err" style="padding:8px">' + (d.error||"读取失败") + '</div>'; return; }
  if (!d.items.length){ list.innerHTML = '<div style="padding:8px;color:#666d76;font-size:12px">还没有对话</div>'; return; }
  d.items.forEach(c => {
    const el = document.createElement("div");
    el.className = "item" + (c.id === curId ? " on" : "");
    el.innerHTML = '<span style="overflow:hidden;text-overflow:ellipsis">' + esc(c.title || "新对话") + '</span>' +
                   '<span class="x">✕</span>';
    el.onclick = (ev) => {
      if (ev.target.classList.contains("x")){ delConvo(c.id); return; }
      openConvo(c.id, c.title, c.model);
    };
    list.appendChild(el);
  });
}

async function openConvo(id, title, model){
  curId = id; curTitle = title || "新对话";
  $("title").textContent = curTitle;
  if (model) $("model").value = model.startsWith("deepseek-reasoner") ? "deepseek-reasoner" : "deepseek-chat";
  const d = await api("/api/ds/msgs?u=" + encodeURIComponent(uid) + "&id=" + encodeURIComponent(id));
  msgs = (d.items || []).map(m => ({role: m.role, content: m.content || "", reasoning: m.reasoning || ""}));
  render(); loadConvos(); loadFiles();
}

async function newConvo(){
  curId = null; curTitle = "新对话"; msgs = [];
  $("title").textContent = curTitle;
  render(); loadConvos();
  $("input").focus();
}

async function delConvo(id){
  if (!confirm("删除这个对话？")) return;
  await api("/api/ds/convo/delete", {u: uid, id});
  if (id === curId) newConvo(); else loadConvos();
}

async function send(textOverride, opts){
  opts = opts || {};
  const input = $("input");
  const text = (textOverride || input.value).trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true;
  if (!opts.isEdit && !opts.isRegen){ input.value = ""; input.style.height = "auto"; }

  if (!opts.isEdit && !opts.isRegen) msgs.push({role: "user", content: text});
  msgs.push({role: "assistant", content: "", reasoning: ""});
  const aiIndex = msgs.length - 1;
  render();

  if (opts.isEdit && curId && msgs.length){
    try {
      const r = await api("/api/ds/edit", {u: uid, id: curId, mid: (msgs[msgs.length-1]||{})._mid || 0, text});
    } catch(e){}
  }

  const body = {
    u: uid, id: curId || "", text,
    model: $("model").value,
    level: $("level").value,
    tier: $("tier").value,
    tierChars: $("tier").value === "custom" ? Math.max(2, Math.min(400, Number($("tierCustom").value) || 24)) * 1000 : 0,
    search: $("search").checked,
  };

  try{
    const res = await fetch("/api/ds/stream", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    if (!res.ok || !res.body){
      const j = await res.json().catch(()=>({}));
      msgs[aiIndex].content = "请求失败：" + (j.error || res.status);
      render(); busy = false; $("send").disabled = false; return;
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const p of parts){
        const line = p.trim();
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        let j = {};
        try { j = JSON.parse(payload); } catch(e){ continue; }
        if (j.cid && !curId){ curId = j.cid; }
        if (j.r){
          msgs[aiIndex].reasoning = (msgs[aiIndex].reasoning || "") + j.r;
          msgs[aiIndex]._open = true;
          render();
        }
        if (j.t){
          msgs[aiIndex].content += j.t;
          const bubbles = $("msgs").querySelectorAll(".row.ai .bubble");
          const last = bubbles[bubbles.length - 1];
          if (last) last.innerHTML = md(msgs[aiIndex].content) + '<span class="cursor"></span>';
          scrollBottom();
        }
        if (j.err){ msgs[aiIndex].content += "\n\n[错误] " + j.err; }
        if (j.done){
          if (typeof j.balance === "number"){
            balance = j.balance;
            $("bal").innerHTML = '余额 <b>¥' + Number(j.balance).toFixed(2) + '</b>';
          }
          if (j.cost) $("hint").textContent = "本次 ¥" + Number(j.cost).toFixed(4) + " · 约 " + j.tokens + " tokens";
        }
      }
    }
    render();
    if (curId){
      const t = curTitle === "新对话" ? text.slice(0, 18) : curTitle;
      curTitle = t; $("title").textContent = t;
      loadConvos();
    }
  }catch(e){
    msgs[aiIndex].content += "\n\n[网络中断] " + e.message;
    render();
  }
  busy = false; $("send").disabled = false;
}

$("send").onclick = () => send();
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("input").addEventListener("input", (e) => {
  const el = e.target;
  el.style.height = "auto";
  el.style.height = Math.min(200, el.scrollHeight) + "px";
});
$("newBtn").onclick = newConvo;
$("search").onchange = () => {
  $("searchTg").classList.toggle("on", $("search").checked);
};
$("file").onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  let bin = "";
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  const b64 = btoa(bin);
  const d = await api("/api/ds/upload", {u: uid, id: curId || "", name: f.name, data: b64});
  if (!d.ok){ alert(d.error || "上传失败"); return; }
  if (!curId && d.id) curId = d.id;
  $("hint").textContent = "已加入 " + d.name + "（" + d.chars + " 字）";
  loadFiles();
  e.target.value = "";
};
$("tier").onchange = () => {
  const on = $("tier").value === "custom";
  $("tierCustom").style.display = on ? "block" : "none";
  if (on) $("tierCustom").focus();
};
$("level").onchange = () => {
  if ($("level").value !== "off") $("model").value = "r1";
};
$("model").onchange = () => {
  if ($("model").value === "r1" && $("level").value === "off") $("level").value = "mid";
};
$("model").onchange = () => {
  if ($("model").value === "deepseek-reasoner"){
    $("think").checked = true; $("thinkTg").classList.add("on");
  }
};
document.querySelectorAll(".chip").forEach(c => {
  c.onclick = () => { $("input").value = c.textContent; $("input").focus(); };
});

if (!uid){
  $("msgs").innerHTML = '<div class="err">没有识别到用户。请先从 /app 登录一次，再回来。</div>';
}else{
  loadConvos();
  loadBalance();
}
</script>
</body>
</html>
