<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>小暖</title>
<link rel="stylesheet" href="/style.css">
<script src="/ui.js" defer></script>

<link rel="stylesheet" href="app.css">
</head>
<body class="p-simple">

<div class="app" id="app">
  <div class="demobar" id="demobar" hidden>
    <span class="demobar-txt">演示模式 · 示例数据</span>
    <span class="demobar-btns">
      <button id="demoPause" type="button">暂停</button>
      <button id="demoNext" type="button">下一步</button>
      <button id="demoFree" type="button">自由体验</button>
      <button id="demoLiveBtn" type="button">自己说</button>
      <button id="demoSkip" type="button">跳过</button>
      <button id="demoExitBtn" type="button">退出演示</button>
    </span>
  </div>

  <div class="democap" id="demoCap" hidden>
  <div class="cap" id="demoCapTxt"></div>
  <div class="dots" id="demoCapDots"></div>
</div>

  <div id="introOv" hidden>
  <iframe id="introFr" src="about:blank" title="开场"></iframe>
  <button id="introSkip" type="button">跳过</button>
</div>
<div class="demoLive" id="demoLive" hidden>
  <input id="demoLiveInp" type="text" placeholder="说一句，走真实接口…" autocomplete="off">
  <button id="demoLiveSend" type="button">发送</button>
</div>


  <div id="famOv" hidden>
  <div class="famcard">
    <h3>家人端 · 今日摘要</h3>
    <div class="famsub">她能看到摘要，看不到原话</div>
    <div id="famChart" class="famchart"></div>
    <div id="famRows"></div>
    <div id="famLib" class="famlib" hidden></div>
    <div class="famfoot">数据来自今天的对话 · 不含隐私原文</div>
    <button id="famClose" type="button">关掉</button>
  </div>
</div>

  <div id="factsOv" class="factsov" hidden>
  <div class="factscard">
    <h3>她记住的方式</h3>
    <div class="factssub">不是存原话，是抽字段</div>
    <div id="factsList"></div>
    <div class="factsfoot">这些字段会在下次对话时被带进 prompt</div>
  </div>
</div>

  <div class="top">
    <div class="name">小暖</div>
    <div class="topact">
      <button class="tbtn" id="topIntro" type="button">开场</button>
      <button class="tbtn" id="topMem" type="button">记忆</button>
      <button class="tbtn" id="topFam" type="button">家人</button>
      <button class="tbtn" id="topStyle" type="button">外观</button>
      <button class="more" id="more" type="button" aria-haspopup="menu">更多</button>
    </div>
  </div>

  <div class="todaybar" id="todaybar">
    <span>今天记住 <b id="tbMem">0</b> 条</span>
    <span class="sep">·</span>
    <span>提醒 <b id="tbRem">0</b> 次</span>
    <span class="sep">·</span>
    <span>主动 <b id="tbPro">0</b> 次</span>
  </div>

  <div class="judgeHint" id="judgeHint">点右上「更多 → 演示一遍」，90 秒看完所有功能</div>

  <div class="guestline" id="guestline" hidden>访客模式 · 数据只在这台设备上</div>

  <div class="greet" id="gree">下午好</div>
  <div class="date" id="dateLine"></div>
  <div class="wx" id="wx" hidden></div>

  <div class="mid">
    <div class="hist" id="hist"></div>
    <div class="said" id="said" aria-live="polite"></div>
    <button class="talk" id="talk" type="button" aria-label="按住说话">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"></rect>
        <path d="M6 11a6 6 0 0 0 12 0M12 17v3M9 20h6" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"></path>
      </svg>
      <span class="tlbl">点一下，打字</span>
    </button>
    <div class="hint" id="hint">按住说话</div>
    <div class="crisis" id="crisis" hidden></div>
    <div class="cmsg" id="cmsg" hidden></div>
  </div>

  <div class="foot">
    <button class="kb" id="kb" type="button">想打字？</button>
    <div class="typebox" id="typebox" hidden>
      <textarea id="inp" rows="1" aria-label="打字"></textarea>
      <button id="send" type="button">发送</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<div class="miss" id="miss" hidden>
  <div class="mt">我没听清，你再说一遍。</div>
  <button id="again" type="button">再说一遍</button>
  <button id="toKb" type="button" class="ghost">想打字</button>
</div>

<div class="cardwrap" id="cardwrap" hidden>
  <div class="card" role="alert">
    <svg class="ring" viewBox="0 0 44 44" aria-hidden="true">
      <circle class="ring-bg" cx="22" cy="22" r="18"></circle>
      <circle class="ring-fg" cx="22" cy="22" r="18" stroke-dasharray="113" stroke-dashoffset="0"></circle>
      <text class="ringtxt" x="22" y="25.5" text-anchor="middle">24h</text>
    </svg>
    <div class="cbody">
      <div class="ct" id="ct">到点了</div>
      <div class="ctime" id="ctime"></div>
      <div class="cw" id="cw"></div>
      <div class="cbtns">
        <button id="know" type="button">知道了</button>
        <button id="later" type="button" class="ghost">晚点再说</button>
      </div>
    </div>
  </div>
</div>

<div class="sheetbg" id="sheetbg" hidden>
  <div class="sheet" role="menu">
    <div class="sgroup">给评委看</div>
    <button id="mDemo" type="button">演示一遍</button>
    <button id="mTry" type="button">自己试一句（真实调用）</button>
    <button id="mMem" type="button">她记住了什么</button>
    <div class="sgroup">显示</div>
    <button id="mSize" type="button">字大一点</button>
    <button id="mStyle" type="button">外观</button>
    <button id="mTts" type="button">朗读：开</button>
    <div class="sgroup">账户</div>
    <a href="/family.html">家人端</a>
    <a href="/login.html">登录</a>
    <div id="demoBox" hidden>
      <div class="demotip">当前是演示模式（时间会被模拟）</div>
      <button id="demoTmrw" type="button">拨到明天 07:00</button>
      <button id="demoSoon" type="button">拨到到点前一小时</button>
      <button id="demoDue" type="button">拨到点</button>
    </div>
    <a href="/index.html">回普通界面</a>
    <button id="mClose" type="button">关掉菜单</button>
  </div>
</div>

<div class="membg" id="membg" hidden>
  <div class="memdrawer" role="dialog" aria-label="她记住的事">
    <div class="memhead">
      <span class="memtitle">她记住的事</span>
      <button id="memClose" type="button">关掉</button>
    </div>
    <div id="factsBox" class="factsbox"></div>
    <div class="memlist" id="memlist"></div>
  </div>
</div>

<div class="sheetbg" id="stybg" hidden>
  <div class="sheet" role="dialog" aria-label="外观">
    <div class="styhead">外观</div>
    <div class="stygrid" id="stygrid"></div>
    <button id="styClose" type="button" class="ghost">关掉</button>
  </div>
</div>




  <script src="app.js" defer></script>
  <script src="demo/script.js" defer></script>
  <script src="demo/state.js" defer></script>
  <script src="demo/view.js" defer></script>
  <script src="demo/live.js" defer></script>
  <script src="demo/index.js" defer></script>
</body>
</html>
